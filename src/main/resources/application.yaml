spring:
  application:
    name: demo
  datasource:
    url: "jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT:3306}/${DATABASE_NAME}"
    username: "${DATABASE_USERNAME}"
    password: "${DATABASE_PASSWORD}"

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}

jwt:
  secret: ${JWT_SECRET:local-development-jwt-secret-32-bytes}
  access-token-expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME:3600000}
